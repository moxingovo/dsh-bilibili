# dsh-bilibili bundle patch — one insert row over the profile tree.
# Override any field in profiles/web/cordis.patch.yml — later layers win per row.
- insert:
    - id: bilibili
      name: 'dsh-bilibili'
      config:
        # 可选：B 站 SESSDATA 登录凭证的环境变量名；留空则匿名
        cookieEnv: BILIBILI_SESSDATA
        # 单请求超时（毫秒）
        requestTimeoutMs: 30000
        # 首选字幕语言标签
        subtitleLanguage: zh-CN
        # bilibili_search 每页结果数上限
        searchMaxPageSize: 20
        # bilibili_subtitles 转录字符上限（超限截断并标记 truncated）
        subtitleMaxChars: 80000
